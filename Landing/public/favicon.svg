<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="io-run-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd236" />
      <stop offset="100%" stop-color="#c9ff3f" />
    </linearGradient>
  </defs>

  <!-- Sharp Obsidian Tile Base -->
  <rect width="48" height="48" fill="#14110e" />
  <rect x="0.5" y="0.5" width="47" height="47" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Monogram "io." -->
  <!-- "i" Dot (Yellow-Green Gradient) -->
  <rect x="8" y="13" width="6" height="6" fill="url(#io-run-grad)" />
  <!-- "i" Stem (Pure White) -->
  <rect x="8" y="22" width="6" height="14" fill="#ffffff" />

  <!-- "o" Geometric Loop (Pure White) -->
  <path d="M18 22 H32 V36 H18 Z M22 26 V32 H28 V26 Z" fill="#ffffff" fill-rule="evenodd" />

  <!-- "." Runner Pulse (Yellow-Green Gradient) -->
  <rect x="35" y="30" width="6" height="6" fill="url(#io-run-grad)" />
</svg>
