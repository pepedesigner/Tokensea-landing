  <!-- Electric Neon Lime Precision Accent -->
  <rect x="32" y="12" width="6" height="6" fill="#c9ff3f" />

  <!-- Vertical Pillar Stem (Pure White) -->
  <rect x="21" y="20" width="6" height="16" fill="#ffffff" />
</svg>
