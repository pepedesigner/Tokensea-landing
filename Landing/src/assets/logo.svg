<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="TokenSea">
  <title>TokenSea</title>
  <!-- Sharp Obsidian Tile Base -->
  <rect width="48" height="48" fill="#14110e" />
  <rect x="0.5" y="0.5" width="47" height="47" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />

  <!-- Minimalist Architectural "T" Monogram -->
  <!-- Top Crossbar (Pure White) -->
